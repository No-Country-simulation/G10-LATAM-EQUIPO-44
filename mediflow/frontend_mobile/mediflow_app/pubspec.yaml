name: mediflow_app
description: "MediFlow: selección local y envío de documentos a la API de triaje."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.0

dependencies:
  file_picker: 13.1.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.6.0
  http_parser: ^4.1.2
  # Agregado por Edil: captura con la aplicacion de camara de Android.
  image_picker: ^1.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  # Agregado por Edil: recurso de marca original proporcionado por el usuario.
  assets:
    - lib/assets/Icono.png
  # Agregado por Edil: tipografía local para Android/Windows, sin peticiones a Google Fonts.
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
          weight: 400
        - asset: assets/fonts/Roboto-Medium.ttf
          weight: 500
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
