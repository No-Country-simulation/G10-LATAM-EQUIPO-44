<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="same-origin">
  <title>Iniciar sesión · MediFlow</title>
  <link rel="stylesheet" href="../assets/css/styles.css">
  <link rel="stylesheet" href="styles.css?v=s4-login-20261024">
</head>
<body data-screen="login">
  <!-- Agregado por Edil: usuarios de MediFlow independientes de la red Tailscale. -->
  <main class="login-shell">
    <section class="login-card" aria-labelledby="loginTitle">
      <a class="login-brand" href="../historial/index.html" aria-label="MediFlow, consultar historial"><span aria-hidden="true">✚</span> MediFlow</a>
      <p class="login-eyebrow">REVISIÓN DOCUMENTAL</p>
      <h1 id="loginTitle">Iniciar sesión</h1>
      <p class="login-description">Ingresa con tu cuenta de MediFlow para registrar decisiones de auditoría.</p>
      <form id="loginForm" method="post" aria-describedby="loginStatus">
        <div class="login-field"><label for="username">Usuario</label><input class="input" id="username" name="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" maxlength="128" required></div>
        <div class="login-field"><label for="password">Contraseña</label><input class="input" id="password" name="password" type="password" autocomplete="current-password" maxlength="1024" required></div>
        <p id="loginStatus" class="login-status" role="status" aria-live="polite">Comprobando sesión…</p>
        <button id="loginSubmit" class="btn btn--primary btn--block" type="submit" disabled>Ingresar</button>
      </form>
      <p class="login-help">Si todavía no tienes una cuenta, solicita su creación al responsable de MediFlow.</p>
      <a class="login-back" href="../auditoria/index.html">Volver al panel</a>
      <noscript><p class="login-status">Activa JavaScript para iniciar sesión.</p></noscript>
    </section>
  </main>
  <script src="../assets/js/api-config.js"></script>
  <script src="../assets/js/auth-api.js?v=s4-login-20261024"></script>
  <script src="app.js?v=s4-login-20261024"></script>
</body>
</html>
